nodeOptions: --max_old_space_size=8192
publicHoistPattern:
  - '@types*'
autoInstallPeers: false

overrides:
  decode-uri-component: '>=0.5.0'
  postcss: '>=8.5.23'
  react-router: ~6.30.2
  uuid: 11.1.1
  '@tootallnate/once': 2.0.1
  lodash: '>=4.18.0'
  minimatch: '>=3.1.3'
  '@babel/core': '>=7.29.6 <8'
  send: '>=0.19.0'
  prismjs: '>=1.30.0'
  braces: '>=3.0.3'
  node-fetch: 2.7.0
  esbuild: '>=0.25.0'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  yorkie: true
