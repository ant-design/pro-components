name: Issue labeled

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  reply-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to issue labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const login = event.issue.user.login;
          let body;
          if (['❤️ help wanted', '👏🏻  Welcome pr'].includes(event.label.name)) {
            body = `Hello @${login}. We totally like your proposal/feedback, welcome to [send us a Pull Request](https://help.github.com/en/articles/creating-a-pull-request) for it. Please provide changelog/TypeScript/documentation/test cases if needed and make sure CI passed, we will review it soon. We appreciate your effort in advance and looking forward to your contribution!

          你好 @${login}，我们完全同意你的提议/反馈，欢迎直接在此仓库 [创建一个 Pull Request](https://help.github.com/en/articles/creating-a-pull-request) 来解决这个问题。请务必提供改动所需相应的 changelog、TypeScript 定义、测试用例、文档等，并确保 CI 通过，我们会尽快进行 Review，提前感谢和期待您的贡献。

          ![giphy](https://user-images.githubusercontent.com/507615/62342668-4735dc00-b51a-11e9-92a7-d46fbb1cc0c7.gif)
          `;
          } else if (event.label.name === '📦  Need to reproduce') {
            body = `Hello @${login}. Please provide a online reproduction by forking this link https://codesandbox.io/ or a minimal GitHub repository.

          你好 @${login}, 我们需要你提供一个在线的重现实例以便于我们帮你排查问题。你可以通过点击 [此处](https://codesandbox.io/) 创建一个 codesandbox 或者提供一个最小化的 GitHub 仓库。
          如何写个好问题？https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md   
          ![](https://gw.alipayobjects.com/zos/antfincdn/y9kwg7DVCd/reproduce.gif)
          `;
          }
          if (!body) process.exit(0);
          execFileSync('gh', ['api', '--method', 'POST', `repos/${process.env.GITHUB_REPOSITORY}/issues/${event.issue.number}/comments`, '--raw-field', `body=${body}`], { stdio: 'inherit' });
          NODE
